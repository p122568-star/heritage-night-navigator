<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문화유산 야행 네비게이터</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
    </div>

    <div class="app-container">
        <header>
            <div class="header-content">
                <h1 class="logo">Heritage Night</h1>
                <p class="subtitle">가족 여행을 위한 야행 & 전국 축제</p>
                <div class="header-badges">
                    <span class="header-badge" id="update-info">데이터 업데이트 중...</span>
                    <span class="header-badge" id="favorites-count">❤️ 찜한 행사 0</span>
                </div>
            </div>
        </header>

        <section class="filter-section">
            <div class="filter-group">
                <label>📅 월별 탐색</label>
                <div class="button-group" id="month-buttons">
                    <button class="filter-btn active" data-value="all">전체</button>
                    <button class="filter-btn" data-value="01">1월</button><button class="filter-btn" data-value="02">2월</button><button class="filter-btn" data-value="03">3월</button><button class="filter-btn" data-value="04">4월</button>
                    <button class="filter-btn" data-value="05">5월</button>
                    <button class="filter-btn" data-value="06">6월</button>
                    <button class="filter-btn" data-value="07">7월</button>
                    <button class="filter-btn" data-value="08">8월</button>
                    <button class="filter-btn" data-value="09">9월</button>
                    <button class="filter-btn" data-value="10">10월</button>
                    <button class="filter-btn" data-value="11">11월</button>
                    <button class="filter-btn" data-value="12">12월</button>
                </div>
            </div>

            <div class="filter-controls"><div class="control-item"><label for="travel-start">여행 시작일</label><input type="date" id="travel-start" class="search-input"></div><div class="control-item"><label for="travel-end">여행 마지막 날</label><input type="date" id="travel-end" class="search-input"></div>
                <div class="control-item">
                    <label>🔍 카테고리</label>
                    <select id="type-filter" class="filter-select">
                        <option value="all">전체 유형</option>
                        <option value="heritage_night">🌙 문화유산 야행</option>
                        <option value="festival">🎉 지역 축제</option>
                        <option value="popular">🔥 인기·대표 축제</option>
                        <option value="long_term">🗓️ 상설·장기 행사 (30일 이상)</option>
                        <option value="favorites">❤️ 내가 찜한 행사</option>
                    </select>
                </div>
                <div class="control-item">
                    <label>📍 지역 선택</label>
                    <select id="region-filter" class="filter-select">
                        <option value="all">전국 지역</option>
                        <option value="서울">서울</option>
                        <option value="경기">경기/인천</option>
                        <option value="충청">충청/대전/세종</option>
                        <option value="경상">경상/부산/대구/울산</option>
                        <option value="전라">전라/광주</option>
                        <option value="강원">강원</option>
                        <option value="제주">제주</option>
                    </select>
                </div>
                <div class="control-item search-item">
                    <label>⌨️ 키워드 검색</label>
                    <div class="search-wrapper">
                        <input type="text" id="search" class="search-input" placeholder="행사명 또는 지역 검색...">
                        <span class="search-icon">🔍</span>
                    </div>
                </div>
            </div>
        </section>

        <main id="event-grid" class="event-grid">
            <div class="loading-container">
                <div class="loader"></div>
                <p>밤하늘의 별들을 모으고 있습니다...</p>
            </div>
        </main>

        <footer>
            <p>© 2026 Heritage Night Navigator. All rights reserved.</p>
        </footer>
    </div>

    <!-- Detail Modal -->
    <div id="detail-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <div id="modal-body">
                <!-- Content injected by JS -->
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
