name: Weekly Festival Data Update

on:
  schedule:
    # 매주 화요일 새벽 0시 (UTC 기준, 한국 시간 오전 9시)
    - cron: '0 0 * * 2'
  workflow_dispatch: # 수동 실행 버튼 추가

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run search script
        run: python festival_search.py

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add data.js
          git commit -m "Auto-update festival data (Weekly)" || echo "No changes to commit"
          git push
