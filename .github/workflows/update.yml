name: Weekly Festival Data Update
on:
  schedule:
    # Monday 09:00 Asia/Seoul = Monday 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: festival-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect festivals
        continue-on-error: true
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
        run: |
          for attempt in 1 2 3; do
            python festival_search.py && exit 0
            echo "축제 API 수집 실패 (${attempt}/3), 10초 후 재시도합니다."
            sleep 10
          done
          echo "::warning::축제 API가 응답하지 않아 기존 데이터를 유지하고 배포합니다."
          exit 1
      - name: Save successful snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.js
          if ! git diff --cached --quiet; then
            git commit -m 'Update festival data'
            git push
          fi
      - name: Prepare website
        run: |
          mkdir public
          cp index.html style.css script.js data.js public/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment
